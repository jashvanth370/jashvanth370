<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Balakirushnan Jashvanth</title>
  <desc id="d">Software Engineering student. Full Stack. Angular, .NET, Cloud.</desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#3b0d0d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ef4444" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <filter id="blurRed" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background, glow and grid -->
  <rect x="1" y="1" width="898" height="218" rx="14" fill="#0a0a0a"/>
  <rect x="1" y="1" width="898" height="218" rx="14" fill="url(#glow)"/>
  <rect x="1" y="1" width="898" height="218" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="218" rx="14" fill="none" stroke="#ef4444" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Corner brackets -->
  <g fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="square">
    <path d="M16 38 V16 H38"/>
    <path d="M862 16 H884 V38"/>
    <path d="M16 182 V204 H38"/>
    <path d="M884 182 V204 H862"/>
  </g>

  <!-- Status pill -->
  <rect x="325" y="22" width="250" height="30" rx="15" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-opacity="0.65" stroke-width="1.2"/>
  <circle cx="348" cy="37" r="4" fill="#ef4444">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="372" y="42" font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="12" font-weight="700" fill="#f87171" textLength="182" lengthAdjust="spacing">OPEN TO OPPORTUNITIES</text>

  <!-- Name (red glow layer + white text) -->
  <text x="450" y="108" text-anchor="middle" font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="800" fill="#ef4444" filter="url(#blurRed)" textLength="720" lengthAdjust="spacing">BALAKIRUSHNAN JASHVANTH</text>
  <text x="450" y="108" text-anchor="middle" font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" filter="url(#softGlow)" textLength="720" lengthAdjust="spacing">BALAKIRUSHNAN JASHVANTH</text>

  <!-- Role line -->
  <g font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="14" font-weight="700">
    <text x="100" y="141" fill="#ef4444" textLength="300" lengthAdjust="spacing">SOFTWARE ENGINEERING STUDENT</text>
    <text x="420" y="141" fill="#6b7280" text-anchor="middle">•</text>
    <text x="440" y="141" fill="#ffffff" textLength="100" lengthAdjust="spacing">FULL STACK</text>
    <text x="560" y="141" fill="#6b7280" text-anchor="middle">•</text>
    <text x="580" y="141" fill="#ef4444" textLength="220" lengthAdjust="spacing">ANGULAR · .NET · CLOUD</text>
  </g>

  <!-- Divider diamond -->
  <g transform="translate(450 162) rotate(45)">
    <rect x="-4" y="-4" width="8" height="8" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Tagline -->
  <g font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="12" font-weight="700">
    <text x="239" y="192" fill="#ef4444" textLength="28" lengthAdjust="spacing">&lt;/&gt;</text>
    <text x="279" y="192" fill="#9ca3af" textLength="382" lengthAdjust="spacing">BUILDING RELIABLE, MODERN APPLICATIONS</text>
  </g>
</svg>
